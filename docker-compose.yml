version: '3.8'

services:
  bot:
    build: .
    container_name: karusel_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Mount assets if you plan to add fonts dynamically
      # - ./assets:/app/assets 
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
